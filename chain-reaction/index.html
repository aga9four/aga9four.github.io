<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f1e2cc" />
  <title>Reazione a catena</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%23ffc83d%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=muqyqy53" />
</head>
<body>
  <canvas id="c"></canvas>

  <div id="top">
    <button id="menuBtn" class="round" aria-label="Menu">☰</button>
    <div id="title"><b id="lvName"></b><small id="lvInfo"></small></div>
    <button id="hintBtn" class="round" aria-label="?">?</button>
  </div>

  <div id="selTools" class="hidden">
    <button id="rotL" class="round">⟲</button>
    <button id="rotR" class="round">⟳</button>
    <button id="del" class="round danger">✕</button>
  </div>

  <div id="zoomTools">
    <button id="zoomIn" class="round small" aria-label="Zoom +">+</button>
    <button id="zoomOut" class="round small" aria-label="Zoom −">−</button>
    <button id="zoomReset" class="round small hidden" aria-label="Zoom 1:1">⤢</button>
  </div>

  <div id="bottom">
    <div id="inv"></div>
    <button id="undo" class="round small">↶</button>
    <button id="redo" class="round small">↷</button>
    <button id="play" class="big"></button>
  </div>

  <div id="dial" class="hidden"><div id="knob">⟳</div></div>
  <div id="mag" class="hidden"></div>
  <div id="toast"></div>
  <div id="rotateTip" class="hidden"></div>
  <div id="shade" class="hidden"></div>
  <div id="panel" class="hidden"></div>
  <div id="replay" class="hidden">
    <div class="media"><canvas id="replayCanvas"></canvas><video id="replayVideo" class="hidden" playsinline loop muted></video></div>
    <div class="side">
      <p id="replayMsg"></p>
      <div id="replayActions" class="hidden">
        <button id="rShare" class="go"></button>
        <button id="rChallenge"></button>
      </div>
      <button id="rClose" class="closeBtn"></button>
    </div>
  </div>
  <div id="splash"><div class="logo"><span class="ball"></span><h1 id="splashTitle"></h1><p id="splashSub"></p></div><button id="splashPlay" class="big"></button></div>
  <div id="loading"><div class="spinner"></div></div>
  <div id="err"></div>
  <script type="module" src="game.js?v=muqyqy53"></script>
</body>
</html>
