<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#f3e6d3" />
<title>Reazione a catena</title>
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "rapier2d": "https://cdn.jsdelivr.net/npm/@dimforge/rapier2d-compat@0.14.0/+esm"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<header id="top">
  <button id="menuBtn" class="round" aria-label="Livelli">&#9776;</button>
  <div id="title"><b id="lvName">…</b><small id="lvInfo"></small></div>
  <button id="hintBtn" class="round" aria-label="Aiuto">?</button>
</header>
<div id="selTools" class="hidden">
  <button id="rotL" class="round">&#10226;</button>
  <button id="rotR" class="round">&#10227;</button>
  <button id="del" class="round danger">&#10005;</button>
</div>
<footer id="bottom">
  <div id="inv"></div>
  <button id="play" class="big">&#9654; Via</button>
</footer>
<div id="toast"></div>
<div id="panel" class="panel hidden"></div>
<div id="loading" class="panel"><h1>Reazione a catena</h1><p>Carico il motore fisico…</p><small>Prototipo · solo meccanica, grafica provvisoria</small></div>
<div id="err"></div>
<script>
  window.addEventListener('error', (e) => { const el = document.getElementById('err'); el.textContent += (e.message || e) + '\n'; el.style.display = 'block'; });
  window.addEventListener('unhandledrejection', (e) => { const el = document.getElementById('err'); el.textContent += 'Promise: ' + (e.reason && e.reason.message || e.reason) + '\n'; el.style.display = 'block'; });
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
